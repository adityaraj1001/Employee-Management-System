{% extends "base.html" %}

{% block title %}Edit Department - EMS{% endblock %}

{% block content %}

<div class="d-flex flex-wrap justify-content-between align-items-center mb-4">
  <div>
    <h2 class="fw-bold mb-1"><i class="bi bi-pencil-square me-2 text-primary"></i>Edit Department</h2>
    <p class="text-muted mb-0">Update department details.</p>
  </div>
  <a href="{{ url_for('department.departmentHome') }}" class="btn btn-outline-secondary">
    <i class="bi bi-arrow-left me-1"></i>Back to Departments
  </a>
</div>

<div class="card border-0 shadow-sm">
  <div class="card-body p-4">
    <form action="{{ url_for('department.departmentEdit', dept_id=dept.id) }}" method="POST" class="needs-validation" novalidate>
      <div class="mb-3">
        <label for="deptName" class="form-label fw-semibold">Department Name</label>
        <input type="text" id="deptName" name="name" class="form-control" value="{{ dept.name }}" required>
        <div class="invalid-feedback">Please enter a department name.</div>
      </div>
      <div class="mb-4">
        <label for="deptHead" class="form-label fw-semibold">Head of Department</label>
        <input type="text" id="deptHead" name="head" class="form-control" value="{{ dept.head if dept.head else '' }}">
      </div>
      <div class="d-flex justify-content-end gap-2">
        <a href="{{ url_for('department.departmentHome') }}" class="btn btn-outline-secondary">Cancel</a>
        <button type="submit" class="btn btn-primary">
          <i class="bi bi-check-circle me-1"></i>Save Changes
        </button>
      </div>
    </form>
  </div>
</div>

{% endblock %}

{% block scripts %}
<script>
document.querySelectorAll('.needs-validation').forEach(function (form) {
    form.addEventListener('submit', function (event) {
        if (!form.checkValidity()) {
            event.preventDefault();
            event.stopPropagation();
        }
        form.classList.add('was-validated');
    }, false);
});
</script>
{% endblock %}
